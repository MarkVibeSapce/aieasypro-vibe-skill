<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe — [ชื่อโปรเจค]</title>

<!-- ═══════════════════════════════════════════════════════════════
  DESIGN TOKENS — build ต้องใช้ค่านี้เป๊ะ ห้ามเปลี่ยน
    color:   primary #2F80ED / ink #0B1F3A / bg #FFFFFF / muted #6B7280 / accent #F2C94C
    font:    display "Poppins" / body "Sarabun"
    spacing: หน่วยฐาน 4px (Tailwind) — section gap = py-12 md:py-16
    radius:  rounded-2xl (การ์ด) / rounded-lg (ปุ่ม)
    signature: การ์ดวิลล่ามีป้ายราคาลอยมุมขวาบน  <-- 1 อย่างที่จำได้ของหน้านี้
  ── วิธีใช้: แก้ token ให้ตรงแบรนด์ → วาด wireframe ด้วย Tailwind class ด้านล่าง
     → ใส่ data-* annotation ครบทุก element สำคัญ → copy ไทยจริง (ไม่ lorem)
═══════════════════════════════════════════════════════════════ -->

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: "Sarabun", sans-serif; color: #0B1F3A; }
  h1,h2,h3,.font-display { font-family: "Poppins", sans-serif; }
</style>
</head>

<!-- data-screen = route ของหน้านี้ -->
<body class="bg-white" data-screen="/villas">

  <!-- ── Header ─────────────────────────────────────────── -->
  <header data-component="SiteHeader"
          class="flex items-center justify-between px-5 py-4 border-b">
    <span class="font-display text-xl font-bold text-[#0B1F3A]">PoolVillaPlus</span>
    <a data-action="goto:/login"
       class="rounded-lg bg-[#2F80ED] px-4 py-2 text-sm font-semibold text-white">
      เข้าสู่ระบบ
    </a>
  </header>

  <!-- ── Hero / ค้นหา ───────────────────────────────────── -->
  <section data-component="SearchHero" class="px-5 py-12 md:py-16 text-center">
    <h1 class="text-2xl md:text-4xl font-bold text-[#0B1F3A]">หาพูลวิลล่าใกล้คุณ</h1>
    <p class="mt-2 text-[#6B7280]">เลือกอำเภอ แล้วจองได้เลยใน 3 นาที</p>
    <div class="mx-auto mt-6 flex max-w-md gap-2">
      <input data-field="search.district" placeholder="พิมพ์ชื่ออำเภอ..."
             class="flex-1 rounded-lg border px-4 py-3 text-sm">
      <button data-action="submit:search"
              class="rounded-lg bg-[#2F80ED] px-5 py-3 text-sm font-semibold text-white">
        ค้นหา
      </button>
    </div>
  </section>

  <!-- ── รายการวิลล่า (สถานะปกติ = มีข้อมูล) ─────────────── -->
  <section data-component="VillaList" data-state="default" class="px-5 pb-12">
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">

      <!-- 1 การ์ด = component VillaCard ทำซ้ำต่อ 1 record -->
      <article data-component="VillaCard"
               data-action="goto:/villa/:id"
               class="relative overflow-hidden rounded-2xl border shadow-sm">
        <!-- signature: ป้ายราคาลอยมุมขวาบน -->
        <span data-field="villa.price_per_night"
              class="absolute right-3 top-3 rounded-lg bg-[#F2C94C] px-2 py-1 text-xs font-semibold">
          ฿4,500/คืน
        </span>
        <div class="h-40 bg-gray-200"><!-- data-field="villa.cover_image" --></div>
        <div class="p-4">
          <h3 data-field="villa.name" class="font-semibold">บ้านสวนริมเล PoolVilla</h3>
          <p data-field="villa.district" class="text-sm text-[#6B7280]">อ.ปากช่อง</p>
        </div>
      </article>

      <!-- ทำซ้ำการ์ดตาม mock ได้อีก 2-3 ใบตอน wireframe -->

    </div>
  </section>

  <!-- ── STATE: ว่าง (ไม่มีวิลล่า) — ต้อง build ให้ครบ ───── -->
  <section data-component="VillaList" data-state="empty" class="hidden px-5 py-16 text-center">
    <!-- empty = บอกทางออก ไม่ใช่หน้าเปล่า -->
    <p class="text-[#6B7280]">ยังไม่มีวิลล่าในพื้นที่นี้</p>
    <button data-action="clear:search"
            class="mt-3 rounded-lg border px-4 py-2 text-sm font-semibold">
      ลองเปลี่ยนอำเภอ
    </button>
  </section>

  <!-- ── STATE: error — ต้อง build ให้ครบ ───────────────── -->
  <section data-component="VillaList" data-state="error" class="hidden px-5 py-16 text-center">
    <p class="text-[#6B7280]">โหลดข้อมูลไม่สำเร็จ</p>
    <button data-action="retry:search"
            class="mt-3 rounded-lg bg-[#2F80ED] px-4 py-2 text-sm font-semibold text-white">
      ลองใหม่
    </button>
  </section>

</body>
</html>
<!-- ═══════════════════════════════════════════════════════════════
  CHECKLIST ก่อน LOCK:
  [ ] ทุก element สำคัญมี data-component / data-field / data-action
  [ ] copy เป็นไทยจริง ไม่มี lorem
  [ ] state empty + error ครบทุก list
  [ ] data-field ทุกตัวมี table.column อยู่ใน database.md
  [ ] signature ชัด 1 อย่าง ที่เหลือเงียบ (MVP restraint)
═══════════════════════════════════════════════════════════════ -->
